[project]
name = "pretix-tables"
dynamic = ["version"]
description = "Table management for pretix events"
readme = "README.rst"
license = {text = "Apache"}
requires-python = ">=3.9"
keywords = ["pretix"]
authors = [
    {name = "Backslash Seven", email = "v.weber@backslashseven.de"},
]
maintainers = [
    {name = "Backslash Seven", email = "v.weber@backslashseven.de"},
]

dependencies = [
]

[project.entry-points."pretix.plugin"]
pretix_tables = "pretix_tables:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[project.urls]
homepage = "https://github.com/backslashseven/pretix-tables"
repository = "https://github.com/backslashseven/pretix-tables"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pretix_tables.__version__"}

[tool.setuptools.packages.find]
include = ["pretix*"]
namespaces = false
